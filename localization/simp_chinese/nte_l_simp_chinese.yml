 nte_global.11.t: "查获虚报海军吨位！"
 nte_global.11.d: "我国海上巡逻舰队与情报官员已掌握确凿证据，证明[SCOPE.sCountry('nte_cheater').GetName]一直在隐瞒军舰真实排水量。"
 nte_global.11.f: "在海上实测面前，钢铁无法撒谎。"
 nte_global.11.a: "公开海军部调查档案"
 nte_global.11.b: "保留证据换取外交筹码"

 nte_global.12.t: "造船厂劳工不满"
 nte_global.12.d: "由于条约限制主力舰铺设龙骨，造船业工会警告将出现大规模裁员与动荡。"
 nte_global.12.f: "空荡的船台最易滋生铆工的怨气。"
 nte_global.12.a: "补贴民用商船改装"
 nte_global.12.b: "维持国营船厂紧缩政策"

 nte_global.13.t: "巡洋舰主炮口径争端"
 nte_global.13.d: "各国海军武官正就万吨级重炮巡洋舰是否违背定性限武精神展开激烈争执。"
 nte_global.13.f: "火炮口径的每一毫米都是外交战场。"
 nte_global.13.a: "坚持严格的万吨级巡洋舰上限"
 nte_global.13.b: "坚持海军部的自主设计权"

 nte_global.14.t: "海军鹰派施压要求退约"
 nte_global.14.d: "多位高级将领警告称，继续受条约配额捆绑将使我国海上生命线暴露于危险之中。"
 nte_global.14.f: "条约的效力永远取决于背后的舰炮。"
 nte_global.14.a: "重申文官政府的外交主导权"
 nte_global.14.b: "拨付预备舰队经费安抚海军部"
 nte_global.15.t: "海军会议的邀请"
 nte_global.15.d: "一名来自[SCOPE.sCountry('nte_gnl_chair').GetName]的信使送来一封火漆封缄的邀请函。全球海军限武条约的缔约国请我们入席，像其他列强一样接受主力舰吨位的分配。海军将领们称之为牢笼，财政部却说这是多年来读到的最明智的一封信。"
 nte_global.15.f: "#italic 会议桌旁的空椅子，就是一张投给我们的反对票。#!"
 nte_global.15.a: "签署加入文书"
 nte_global.15.a.tt: "我国将以正式缔约国身份加入条约并接手相应的日志条目。日后只能通过日志条目退约。"
 nte_global.15.b: "婉言谢绝"

 nte_bilateral.21.t: "双边海军限武条约期满"
 nte_bilateral.21.d: "[SCOPE.sCountry('nte_bilateral_target').GetName]已和平履约十年，我国与其签署的双边海军限武协定迎来期满重谈。"
 nte_bilateral.21.f: "十年的克制之后，是续约还是放手？"
 nte_bilateral.21.a: "续签十年双边限武协定"
 nte_bilateral.21.b: "放宽上限至 75% 以示善意"
 nte_bilateral.21.c: "和平终止条约，不再续签"

 nte_bilateral.22.t: "海军武官核查摩擦"
 nte_bilateral.22.d: "条约监督国派驻的海军武官要求直接查阅我国干船坞建造账簿。"
 nte_bilateral.22.f: "信任归信任，铆钉还得数清楚。"
 nte_bilateral.22.a: "开放船坞建造账簿供核查"
 nte_bilateral.22.b: "将武官活动限制为礼节性访问"

