 nte_bilateral.20.c: "标准均势：维持默认的 60% 比例上限"
 nte_bilateral.20.c_tt: "[SCOPE.sCountry('nte_bilateral_target').GetName]的双边海军限武上限维持为[ROOT.GetCountry.GetName]有效吨位的 #v 60%#!。"
