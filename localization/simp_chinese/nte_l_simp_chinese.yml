 # Treaty Articles
 bilateral_naval_limitation_treaty: "双边海军限武条约"
 bilateral_naval_limitation_treaty_desc: "#lore “胜利者的墨水，足以裁定败者船坞中每一根龙骨的生死。”#!\n一项带有强制与屈辱性质的不平等双边海上裁军条款，通常仅能通过战争威慑或[concept_diplomatic_play]强迫[concept_country]接受，将其[concept_fleet]严格压制在主导国实力的一定比例之下。"
 bilateral_naval_limitation_treaty_effects_desc: "•强制将受约国的[concept_fleet]有效吨位限制为主导国的一定比例（默认 #v 60%#!，生效后可由主导方通过外交照会事件在 #v 30% / 50% / 60% / 75%#! 间选定）\n•可在[concept_diplomatic_play]中作为战争目标强迫战败方签订；限制期内削减受约国主力舰建造效率，若持续违约拒不裁军，主导国可发起强制履约战争"
 bilateral_naval_limitation_treaty_article_short_desc: "[SOURCE_COUNTRY.GetFlagTextIcon][SOURCE_COUNTRY.GetNameNoFormatting]的[concept_fleet]吨位不得超过[TARGET_COUNTRY.GetFlagTextIcon][TARGET_COUNTRY.GetNameNoFormatting]的指定比例"
 BILATERAL_NAVAL_LIMITATION_TREATY_POSSIBLE: "目标[concept_country]必须拥有至少一支[concept_fleet]。"
 BILATERAL_NAVAL_LIMITATION_TREATY_AT_WAR: "双方目前不得处于[concept_war]状态。"
 BILATERAL_NAVAL_LIMITATION_TREATY_INPUT_VALID: "双边限武比例须在有效区间内。"
 BILATERAL_NAVAL_LIMITATION_TREATY_DUPLICATE_ARTICLE_SAME: "双方之间已存在生效中的同类双边限武[concept_article]。"
 BILATERAL_NAVAL_LIMITATION_TREATY_ALREADY_RESTRICTED: "目标[concept_country]目前已被另一项生效中的双边限武条约限制。"

 global_naval_limitation_treaty: "全球海军限武条约"
 global_naval_limitation_treaty_desc: "#lore “与其在无底洞般的造舰竞赛中耗尽国库，不如在谈判桌上划定各大洋的吨位疆界。”#!\n邀请各大海上强权共同加入多边海军限武体系，在各缔约国之间建立公开透明的吨位配额与常规外交监督机制。"
 global_naval_limitation_treaty_effects_desc: "•按 #v 5:5:3:1.75:1.75#! 席位比例锁定各成员国的[concept_fleet]有效吨位上限\n•履约成员获得 #g -10%#! 海军维护费与[concept_prestige]红利，并可通过条约大会进行配额修订、外交孤立制裁或激活升级条款"
 global_naval_limitation_treaty_article_short_desc: "[FIRST_COUNTRY.GetFlagTextIcon][FIRST_COUNTRY.GetNameNoFormatting]与[SECOND_COUNTRY.GetFlagTextIcon][SECOND_COUNTRY.GetNameNoFormatting]共同遵守全球海军限武[concept_treaty]配额"
 GLOBAL_NAVAL_LIMITATION_TREATY_POSSIBLE: "缔约双方均须达到[concept_major_power]或更高的[concept_rank]。"
 GLOBAL_NAVAL_LIMITATION_TREATY_AT_WAR: "缔约双方目前不得处于[concept_war]状态。"
 GLOBAL_NAVAL_LIMITATION_TREATY_COLLAPSED: "条约体系瓦解后的 3 年冷却期内无法重新缔结全球限武条约。"
 GLOBAL_NAVAL_LIMITATION_TREATY_FORMED: "若全球海军限武[concept_treaty]已成立，新成员须与任一现行缔约国缔结此[concept_article]。"
 GLOBAL_NAVAL_LIMITATION_TREATY_ALREADY_BOTH_MEMBERS: "缔约双方不得均已加入全球海军限武体系。"

 # Events - Global
 nte_global.1.t: "加入全球海军限武条约"
 nte_global.1.d: "我国代表团已在会议桌前落座并签署条约文本。本国海军舰队将按舰船时代与复杂度核算真实有效吨位，并锁定相应的席位比例。"
 nte_global.1.f: "礼炮声取代了舰炮的轰鸣，至少在纸面上，列强暂时收起了无止境造舰的野心。"
 nte_global.1.a: "为了海洋的秩序与和平"
 nte_global.1.a.tt: "开启「全球海军限武条约大会」日志以查看实时吨位与海权天梯。"

 nte_global.2.t: "条约配额修订大会投票"
 nte_global.2.d: "新一轮条约配额修订大会已经开幕。各成员国的投票权重由基础席位票与当前有效吨位共同决定，最终结果将按所有成员的加权平均值连续调整基准上限。"
 nte_global.2.f: "外交官与海军将领在地图桌前寸土必争，每一个百分点都关乎未来十年的船坞订单。"
 nte_global.2.a: "大幅裁军（-15% 基准吨位）"
 nte_global.2.b: "适度削减（-5% 基准吨位）"
 nte_global.2.c: "维持现状（0% 调整）"
 nte_global.2.e: "适度放宽（+5% 基准吨位）"
 nte_global.2.g: "大幅扩军（+15% 基准吨位）"

 nte_global.3.t: "外交孤立制裁质询"
 nte_global.3.d: "已有成员国对 [SCOPE.sCountry('nte_iso_target').GetName] 提出正式孤立质询。若大会以 75% 以上有效加权票通过，该国将被剥夺条约红利、合法上限削减 25% 并遭受严厉的国际贸易与恶名制裁。"
 nte_global.3.f: "当一国执意破坏共同规则时，孤立便是外交场上最冰冷的铁锤。"
 nte_global.3.a: "赞成孤立并制裁该国"
 nte_global.3.b: "反对或保持克制"

 nte_global.4.t: "修订大会投票结果公布"
 nte_global.4.d: "本次修订大会已结束计票。本次基准吨位净调整幅度为 #v [GetGlobalVariable('gnl_last_vote_pct_change').GetValue|1]%#!，新的基准吨位已定为 #v [GetGlobalVariable('gnl_tonnage_base_limit').GetValue|0]#! 吨。"
 nte_global.4.f: "无论结果是否令所有舰队司令满意，条约的齿轮仍在继续转动。"
 nte_global.4.a: "海军部已收到最新配额"

 # Events - Bilateral Crisis & Appeasement
 nte_bilateral.1.t: "[SCOPE.sCountry('nte_breaker').GetName] 撕毁双边限武条约"
 nte_bilateral.1.d: "尽管双方此前签有严格的海军吨位限制条约，[SCOPE.sCountry('nte_breaker').GetName] 仍单方面废止了限制条款。我国海军部与内阁正等待您的强硬回应。"
 nte_bilateral.1.f: "一纸条约究竟是铁律，还是对方眼里随时可撕的废纸？"
 nte_bilateral.1.a: "立即递交最后通牒，勒令其退让！"
 nte_bilateral.1.b: "仅作外交抗议，避免事态扩大"

 nte_bilateral.2.t: "来自 [SCOPE.sCountry('nte_enforcer').GetName] 的最后通牒"
 nte_bilateral.2.d: "[SCOPE.sCountry('nte_enforcer').GetName] 对我国单方面废止双边限武条约表示极度愤慨，并已递交措辞严厉的最后通牒：要么重新接受造舰限制，要么准备承担外交与军事后果。"
 nte_bilateral.2.f: "伦敦或华盛顿的电报已经拍到案头，现在轮到我们选择屈服还是硬撼。"
 nte_bilateral.2.a: "暂避锋芒，接受限制与减速"
 nte_bilateral.2.b: "撕碎通牒！没有任何国家能束缚我们的舰队"

 nte_bilateral.3.t: "[SCOPE.sCountry('nte_breaker').GetName] 拒绝了最后通牒！"
 nte_bilateral.3.d: "[SCOPE.sCountry('nte_breaker').GetName]公然拒绝了[ROOT.GetCountry.GetName]的最后通牒，其造船厂正在全速开工。内阁要求在全面贸易外交制裁与直接武装干涉之间做出最终抉择。"
 nte_bilateral.3.f: "外交辞令已经穷尽，剩下的只有封锁港口或炮舰发言。"
 nte_bilateral.3.a: "实施五年期全面贸易与外交制裁"
 nte_bilateral.3.b: "发起强制履行条约[concept_diplomatic_play]，准备武力裁军！"
 nte_bilateral.3.c: "事已至此，暂且隐忍"

 nte_bilateral.10.t: "友好邦交国的海上绥靖"
 nte_bilateral.10.d: "与我国关系融洽的 [SCOPE.sCountry('nte_breaker').GetName] 请求摆脱双边限武条约的束缚。鉴于两国深厚的友谊，内阁建议体面承认既成事实，以换取长期战略合作。"
 nte_bilateral.10.f: "对朋友的让步有时被称作高瞻远瞩，有时也被批评为姑息养奸。"
 nte_bilateral.10.a: "体面承认并保留友好关系（绥靖）"
 nte_bilateral.10.b: "表达严肃的外交失望"

 nte_punitive_naval_play: "强制履行海军限武条约"
 nte_je_status_holiday: "#p 海军假期生效中#! — 列强暂停主力舰扩军并享受军费减免"
 nte_btn_propose_naval_holiday_name: "倡议「三年海军假期」"
 nte_btn_propose_naval_holiday_desc: "向全体条约成员国发起为期 3 年的造舰暂停倡议。响应者将大幅减缓主力舰建造（-75%），换取 -15% 海军物资维护费与[concept_prestige]、[concept_infamy]衰减红利。"
 nte_btn_holiday_cooldown_tt: "距离上次海军假期倡议已过冷却期（60 个月）"
 nte_btn_toggle_mothball_fleet_name: "封存 / 解封后备舰队"
 nte_btn_toggle_mothball_fleet_desc: "和平时期将部分舰队转入港口封存，可立即减少 #v 18%#! 的条约有效吨位占用与 #v 20%#! 的维护开销，代价是[concept_naval_power_projection]降低 25% 且主力舰建造效率降低 35%。"
 nte_btn_naval_intelligence_exchange_name: "公开船坞与海军情报互换"
 nte_btn_naval_intelligence_exchange_desc: "付出少量行政审核成本以公开船坞清单，换取外交声誉、稳定度提升与更严密的违约侦察，并立即刷新全成员国真实吨位与海权天梯。"
