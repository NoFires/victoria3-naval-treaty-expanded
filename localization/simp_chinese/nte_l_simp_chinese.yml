 je_nte_bilateral_treaty_reason: "城下之盟的墨迹尚新。如今[ROOT.GetCountry.GetName]的舰队规模要由他国的海军武官来丈量，一旦越线，最后通牒便会送到外交部。若能安分守约十年，这纸条约或许还能体面地画上句号。"
