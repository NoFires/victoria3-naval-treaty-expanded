 nte_naval_race_panic_modifier: "无畏舰竞赛恐慌"
 nte_btn_scrap_obsolete_hulls_name: "拆解老旧主力舰与和平补贴"
 nte_btn_scrap_obsolete_hulls_desc: "在和平时期将超龄战舰转入拆解并让船坞转产民用，未来 24 个月内有效条约吨位降低 #v 10%#!，节省 -5% 海军维护费并提升商业运力（+8%）与$ig_industrialists$好感，但会降低海军基地吞吐量（-15%）、削减主力舰建造效率（-35%）与力量投射（-10%）并引起$ig_armed_forces$不满。"
 nte_btn_submarine_protocol_name: "签署《潜艇作战与商船护航议定书》"
 nte_btn_submarine_protocol_desc: "占用 #v 25#! 点[concept_influence]承诺遵守人道主义商船搜查规则（不可在欺诈期间签署），削弱潜艇破交火力以换取外交声誉、恶名加速消退及条约稳定度。"
 nte_global.7.t: "五年一度国际海军峰会开幕"
 nte_global.7.d: "各缔约国海军代表齐聚一堂，回顾过去五年全球吨位限额与造舰秩序的执行情况。面对不断演进的造船工业与地缘局势，我国代表团必须亮明立场。"
 nte_global.7.f: "会议桌上的尺规与港口里的龙骨同样决定着大洋的秩序。"
 nte_global.7.a: "重申海上和平公约，维持现有限额"
 nte_global.7.b: "主张顺应工业发展，将全球基准上限上调 5%"
 nte_global.7.c: "当场退席抗议！单方面撕毁条约义务"
 nte_global.8.t: "列强惊呼：超重型违约战舰现身大洋！"
 nte_global.8.d: "情报显示某缔约国竟将单舰体量与装甲魔改推至远超传统战列舰的极限，引发各国海军部强烈震动与恐慌。"
 nte_global.8.f: "当一艘战舰的排水量改写规则时，旧时代的表格便已作废。"
 nte_global.8.a: "严词谴责质变突破，重申现行条约约束"
 nte_global.8.b: "立即追加紧急海军预算，迎战新一轮军备竞赛"
 nte_global.9.t: "大舰巨炮的时代归来：海军条约体系瓦解"
 nte_global.9.d: "随着条约稳定度彻底归零或成员相继退出，曾经束缚列强造船厂的国际海军限武体系已名存实亡。各大洋再次响起密集的龙骨铺设声。"
 nte_global.9.f: "条约曾给予世界喘息之机，如今钢铁洪流将重新主宰潮汐。"
 nte_global.9.a: "命令所有船坞全速开工"
 nte_global.10.t: "多槽位重型改装与军备竞赛的冲击"
 nte_global.10.d: "随着海军工业迈入模块化深度改装时代，十槽位新型主力舰的火炮口径、装甲厚度与造船热潮正不断突破早期海军条约的计量边界。各缔约国海军部紧急呼吁重新校准吨位标准。"
 nte_global.10.f: "当每一座炮塔与锅炉舱都能被重新定义，纸面上的尺规必须追上船坞里的钢铁。"
 nte_global.10.a: "顺应新型战舰技术现实，将全球基准限额放宽 10%"
 nte_global.10.b: "严守条约检验红线，重申对重型改装的限制"
