 nte_global.5.t: "「三年海军假期」倡议"
 nte_global.5.d: "条约大会正式提出「海军假期」方案，呼吁各列强在未来三年内实质性冻结主力舰龙骨铺设，将宝贵的财政资源归还给国内经济与民生。"
 nte_global.5.f: "船坞的塔吊暂时停摆，至少在接下来的几个冬天里，财政大臣可以睡个安稳觉了。"
 nte_global.5.a: "响应海军假期，享受军费减免与和平红利"
 nte_global.5.b: "拒绝冻结造舰，继续扩充舰队"
 nte_btn_falsify_tonnage_name: "秘密虚报海军吨位（条约欺诈）"
 nte_btn_falsify_tonnage_desc: "消耗 #v 50#! 点[concept_influence]维护保密渠道，在未来 24 个月内秘密隐瞒 #v 12%#! 的条约有效吨位。警告：若他国开启「海军情报互换」或本国存在超重型主力舰，极易暴露并招致严厉制裁！"
 nte_ig_navy_disappointed: "不满海军限武妥协"
 nte_ig_peace_dividend_happy: "赞赏和平红利与军费削减"
 nte_ig_navy_expansion_happy: "支持海军扩张与舰队预算"
 nte_global.6.t: "秘密造舰欺诈东窗事发！"
 nte_global.6.d: "外国海军武官与情报机构获取了我国船坞的真实图纸，揭穿了我国长期虚报主力舰吨位的骗局！各缔约国对此表示强烈愤慨。"
 nte_global.6.f: "纸终究包不住钢铁巨兽的真实排水量。"
 nte_global.6.a: "外交信誉扫地，准备承受制裁……"
