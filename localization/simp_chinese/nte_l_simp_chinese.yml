 nte_bilateral_attache_friction: "海军武官核查摩擦"
 nte_bilateral.20.t: "双边限武吨位比例照会"
 nte_bilateral.20.d: "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('nte_bilateral_target').GetName]签署的双边海军限武条约已正式生效。[ROOT.GetCountry.GetName]海军部与外交部现需照会[SCOPE.sCountry('nte_bilateral_target').GetName]，确定具体的[concept_fleet]吨位限制比例（若为战争强制城下之盟，严厉裁军不再额外招致外交恶名）。"
 nte_bilateral.20.f: "数字写在纸面上，决定着船坞未来十年能下水多少龙骨。"
 nte_bilateral.20.a: "严厉裁军：限制[SCOPE.sCountry('nte_bilateral_target').GetNameNoFormatting]不得超过[ROOT.GetCountry.GetNameNoFormatting]的 30%"
