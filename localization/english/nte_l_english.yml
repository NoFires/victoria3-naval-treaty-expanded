 nte_bilateral.20.t: "Bilateral Naval Tonnage Ratio Dispatch"
 nte_bilateral.20.d: "The bilateral naval limitation treaty between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('nte_bilateral_target').GetName] is now in force. Specify the exact [concept_fleet] tonnage ceiling imposed on [SCOPE.sCountry('nte_bilateral_target').GetName] (imposing 30% via war enforcement incurs no extra infamy)."
 nte_bilateral.20.f: "Numbers committed to parchment decide how many keels may be laid over the next decade."
 nte_bilateral.20.a: "Strict Limitation: Cap [SCOPE.sCountry('nte_bilateral_target').GetNameNoFormatting] at 30% of [ROOT.GetCountry.GetNameNoFormatting]"
 nte_bilateral.20.a_tt: "Sets [SCOPE.sCountry('nte_bilateral_target').GetName]'s bilateral cap to #v 30%#! of [ROOT.GetCountry.GetName] (in peacetime costs #v 50#! [concept_influence] for 12 months and adds #r +3#! [concept_infamy]; free if war-enforced; worsens relations by #r -25#!)."
 nte_bilateral.20.b: "Half Parity: Cap [SCOPE.sCountry('nte_bilateral_target').GetNameNoFormatting] at 50% of [ROOT.GetCountry.GetNameNoFormatting]"
 nte_bilateral.20.b_tt: "Sets [SCOPE.sCountry('nte_bilateral_target').GetName]'s bilateral cap to #v 50%#! of [ROOT.GetCountry.GetName] (worsens relations by #r -10#!)."
 nte_bilateral.20.c: "Standard Parity: Keep default 60% cap"
 nte_bilateral.20.c_tt: "Keeps [SCOPE.sCountry('nte_bilateral_target').GetName]'s bilateral naval tonnage cap at #v 60%#! of [ROOT.GetCountry.GetName]."
 nte_bilateral.20.e: "Lenient Cap: Allow [SCOPE.sCountry('nte_bilateral_target').GetNameNoFormatting] up to 75% of [ROOT.GetCountry.GetNameNoFormatting]"
 nte_bilateral.20.e_tt: "Sets [SCOPE.sCountry('nte_bilateral_target').GetName]'s bilateral cap to #v 75%#! of [ROOT.GetCountry.GetName] (improves relations by #g +15#!)."

 nte_outcome_withdrawn: "Withdrawn from Naval Treaty"
 nte_outcome_withdrawn_effect_header: "Treaty Obligations Terminated"
 nte_outcome_withdrawn_desc: "Having withdrawn from the Global Naval Limitation Treaty, our shipyards are once more unbound by international quotas—though our rivals are watching."

 je_nte_bilateral_treaty: "Bilateral Naval Limitation"
 je_nte_bilateral_treaty_desc: "Our [concept_fleet] is bound by a bilateral tonnage limitation treaty. Current effective tonnage: [SCOPE.ScriptValue('nte_country_cached_effective_tonnage')|0] / [Country.MakeScope.Var('nte_bilateral_cap').GetValue|0] ([Country.MakeScope.Var('nte_bilateral_ratio_pct').GetValue|0]% cap)."
 je_nte_bilateral_treaty_reason: "The ink on a dictated peace is still fresh. Foreign naval attachés now measure [ROOT.GetCountry.GetName]'s fleet, and any breach brings an ultimatum to the foreign ministry. Ten quiet years of compliance may let the treaty end with dignity."
 je_nte_bilateral_treaty_activation_tt: "Activated when bound by a Bilateral Naval Limitation Treaty."
 nte_bilateral_je_status_compliant: "Fleet tonnage is within bilateral treaty limits."
 nte_bilateral_je_status_near: "Fleet tonnage is approaching the bilateral treaty cap (90%+)."
 nte_bilateral_je_status_over: "Fleet tonnage exceeds the bilateral treaty cap! Enforcer intervention is imminent."
 je_nte_bilateral_treaty_lifted_header: "Bilateral Restrictions Lifted"
 je_nte_bilateral_treaty_lifted_effect_header: "Naval Sovereignty Restored"
 je_nte_bilateral_treaty_lifted_desc: "The bilateral naval limitation treaty is no longer in force."

 NTE_ACCEPTANCE_DREADNOUGHT_RACE: "From [SCOPE.sCountry('target').GetName] dreadnought arms race anxiety"
 NTE_ACCEPTANCE_FOUNDING_CONFERENCE: "From [SCOPE.sCountry('target').GetName] prestige of founding the naval conference"

 nte_global.6.b: "Defy the Inspection and Stonewall"
 nte_global.6.c: "Arrange a Backchannel Diplomatic Settlement"

 nte_global.11.t: "Falsified Tonnage Uncovered!"
 nte_global.11.d: "Our naval patrols and intelligence officers have uncovered hard proof that [SCOPE.sCountry('nte_cheater').GetName] has been concealing warship displacement."
 nte_global.11.f: "Steel cannot lie when measured at sea."
 nte_global.11.a: "Publish the Admiralty Dossier"
 nte_global.11.b: "Use the Evidence for Quiet Leverage"

 nte_global.12.t: "Dockyard Labor Friction"
 nte_global.12.d: "With capital ship keels halted under treaty constraints, shipyard guilds warn of layoffs and unrest."
 nte_global.12.f: "Empty slipways breed restless riveters."
 nte_global.12.a: "Subsidize Merchant Hull Conversion"
 nte_global.12.b: "Maintain State Shipyard Austerity"

 nte_global.13.t: "Cruiser Caliber Dispute"
 nte_global.13.d: "Naval attaches are clashing over whether 10,000-ton cruisers armed with heavy batteries violate the spirit of qualitative limitation."
 nte_global.13.f: "Every millimeter of gun bore is a diplomatic battleground."
 nte_global.13.a: "Uphold Strict 10,000t Limits"
 nte_global.13.b: "Insist on Admiralty Design Autonomy"

 nte_global.14.t: "Admiralty Hawks Press for Withdrawal"
 nte_global.14.d: "Senior admirals warn that remaining bound by treaty quotas leaves our sea lanes dangerously exposed."
 nte_global.14.f: "A treaty is only as strong as the guns behind it."
 nte_global.14.a: "Reaffirm Civilian Diplomatic Control"
 nte_global.14.b: "Placate the Admiralty with Reserve Funds"
 nte_global.15.t: "An Invitation to the Naval Conference"
 nte_global.15.d: "A courier from [SCOPE.sCountry('nte_gnl_chair').GetName] has delivered a sealed invitation. The signatories of the Global Naval Limitation Treaty ask us to take our seat at their table and accept a share of capital ship tonnage like every other Great Power. Our admirals call it a cage. Our finance ministry calls it the first sensible letter it has read in years."
 nte_global.15.f: "#italic An empty chair at a conference is a vote cast against us.#!"
 nte_global.15.a: "Sign the Instrument of Accession"
 nte_global.15.a.tt: "We join the treaty as a full signatory and take up its journal entries. Leaving again is only possible through the journal entry."
 nte_global.15.b: "Decline with Regrets"

 nte_bilateral.21.t: "Bilateral Naval Treaty Expiration"
 nte_bilateral.21.d: "After ten years of peaceful compliance by [SCOPE.sCountry('nte_bilateral_target').GetName], our bilateral naval limitation agreement is up for review."
 nte_bilateral.21.f: "A decade of restraint invites either renewal or release."
 nte_bilateral.21.a: "Renew the Limitation for Another Decade"
 nte_bilateral.21.b: "Ease the Ratio to 75% as Goodwill"
 nte_bilateral.21.c: "Allow the Treaty to Lapse Peacefully"

 nte_bilateral.22.t: "Naval Attache Inspection Friction"
 nte_bilateral.22.d: "Visiting naval attaches from our treaty enforcer are demanding direct access to drydock construction ledgers."
 nte_bilateral.22.f: "Trust, but inspect the rivets."
 nte_bilateral.22.a: "Grant Full Dockyard Ledger Access"
 nte_bilateral.22.b: "Restrict Attaches to Ceremonial Visits"

