 nte_gnl_treaty_council: "Treaty Council"
 nte_gnl_treaty_council_reason: "Delegates face one another across the conference table. Revising quotas, sanctioning a defaulter, declaring a naval holiday: every motion goes to a weighted vote, and the chair's count often settles it."
 nte_council_status_in_recess: "The conference hall is quiet; no motion awaits a vote."
 nte_gnl_fleet_compliance: "Fleet Compliance Office"
 nte_gnl_fleet_compliance_reason: "The admiralty keeps a treaty office of its own. Here officers decide which squadrons are laid up and which old hulls go to the breakers, and some argue the figures on the return could stand to be a little smaller."
 nte_compliance_status_over: "#r Our fleet has crossed the treaty limit.#! Once the grace period runs out, sanctions follow."
 nte_compliance_status_near: "#v Tonnage is nearing the limit#!, and the admiralty quarrels over every new keel."
 nte_compliance_status_mothballed: "The reserve squadrons lie in harbour, their fires drawn."
 nte_compliance_status_clear: "The fleet sits well inside its quota; the admiralty can rest easy for now."
 nte_gnl_naval_diplomacy: "Naval Diplomacy"
 nte_gnl_naval_diplomacy_reason: "Naval attachés trade gossip over embassy dinners while diplomats weigh every clause of the protocols. The rules of submarine warfare and the truth about each other's fleets are both stakes at this table."
 nte_naval_diplomacy_status_both: "We honour the Submarine Protocol and share intelligence with fellow signatories."
 nte_naval_diplomacy_status_protocol: "We have signed the Submarine Protocol; our submarines must fight by cruiser rules."
 nte_naval_diplomacy_status_intel: "Our attachés are trading fleet intelligence with the other signatories."
 nte_naval_diplomacy_status_idle: "No protocol binds us, and no intelligence changes hands."
