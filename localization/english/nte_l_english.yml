 nte_scrap_dividend_modifier: "Peaceful Hull Scrapping Dividend"
 nte_submarine_protocol_modifier: "London Submarine Protocol"
 nte_naval_race_panic_modifier: "Naval Arms Race Panic"
 nte_btn_scrap_obsolete_hulls_name: "Scrap Obsolete Hulls for Peace Dividend"
 nte_btn_scrap_obsolete_hulls_desc: "Decommission aging warships in peacetime for 24 months, cutting effective tonnage by #v 10%#!, saving -5% naval upkeep, and boosting civilian trade (+8% capacity/throughput) and [GetInterestGroupVariant('ig_industrialists',ROOT.GetCountry).GetNameWithCountryVariant] goodwill—at the cost of -15% naval base throughput, -35% capital ship construction, -10% projection, and [GetInterestGroupVariant('ig_armed_forces',ROOT.GetCountry).GetNameWithCountryVariant] resentment."
 nte_btn_submarine_protocol_name: "Sign Submarine & Cruiser Protocol"
 nte_btn_submarine_protocol_desc: "Commit #v 25#! [concept_influence] and curb submarine raiding in exchange for diplomatic reputation, faster [concept_infamy] decay, trade safety, and treaty stability."
 nte_global.7.t: "Quinquennial International Naval Conference"
 nte_global.7.d: "Admiralty delegates from every signatory power have convened to review the past five years of naval limitation. Our delegation must declare our stance before the conference."
 nte_global.7.f: "Compasses on parchment decide the fate of keels on the slipway."
 nte_global.7.a: "Reaffirm the Maritime Peace Pact"
 nte_global.7.b: "Demand +5% Global Tonnage Baseline Expansion"
 nte_global.7.c: "Walk Out in Protest and Denounce the Treaty!"
 nte_global.8.t: "Super-Heavy Capital Ship Sparks Maritime Panic!"
 nte_global.8.d: "Naval intelligence confirms a signatory has launched a heavily modified capital ship pushing beyond qualitative treaty norms, sending shockwaves through rival admiralties."
 nte_global.8.f: "When one hull outclasses every ledger entry, old parchment loses its weight."
 nte_global.8.a: "Condemn Qualitative Escalation"
 nte_global.8.b: "Authorize Emergency Naval Armament Spending"
 nte_global.9.t: "Treaty Collapse: Return of the Arms Race"
 nte_global.9.d: "With treaty stability shattered, the global naval limitation regime has ceased to exist. Shipyards across the great powers are roaring back to full wartime capacity."
 nte_global.9.f: "Treaties bought the seas a brief silence; now steel and steam reclaim the horizon."
 nte_global.9.a: "Lay Down New Keels Without Delay"
 nte_global.10.t: "Multi-Slot Hulls & The Naval Arms Race"
 nte_global.10.d: "Modular warship design and expanding naval construction booms have pushed modern ten-slot capital ships far beyond early treaty displacement assumptions. Admiralties across the signatories demand an urgent ruling on how to regulate this new generation of dreadnoughts."
 nte_global.10.f: "When every turret, boiler, and armor belt can be endlessly refined, treaty parchment must keep pace with the slipway."
 nte_global.10.a: "Accommodate Modern Hull Designs (+10% Global Tonnage Baseline)"
 nte_global.10.b: "Enforce Strict Treaty Inspection Standards (+6 Treaty Stability)"
