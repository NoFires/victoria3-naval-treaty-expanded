 nte_global.6.t: "Tonnage Falsification Exposed!"
 nte_global.6.d: "Foreign naval attachés obtained our true dockyard blueprints, exposing our systematic under-reporting of fleet tonnage to the world."
 nte_global.6.f: "Paper ledgers could not forever conceal steel Leviathans."
 nte_global.6.a: "A diplomatic catastrophe..."
 nte_je_activation_tt: "Activated by signing the Global Naval Limitation Treaty."
