 bilateral_naval_limitation_treaty: "Bilateral Naval Limitation Treaty"
 bilateral_naval_limitation_treaty_desc: "#lore \"The victor's ink can decide the fate of every keel laid in the vanquished dockyards.\"#!\nA coercive, humiliating bilateral disarmament clause that normally requires war enforcement via a [concept_diplomatic_play] to compel a [concept_country] to cap its [concept_fleet] below a fraction of the victor's strength."
 bilateral_naval_limitation_treaty_effects_desc: "•Caps the target [concept_country]'s effective [concept_fleet] tonnage at a chosen percentage of the enforcer's (defaults to #v 60%#!; adjustable to #v 30% / 50% / 60% / 75%#! via post-signing event)\n•Enforceable as a War Goal in a [concept_diplomatic_play]; slows the target's capital ship construction, and prolonged breach enables a punitive enforcement war"
 bilateral_naval_limitation_treaty_article_short_desc: "[SOURCE_COUNTRY.GetFlagTextIcon][SOURCE_COUNTRY.GetNameNoFormatting] limits its [concept_fleet] relative to [TARGET_COUNTRY.GetFlagTextIcon][TARGET_COUNTRY.GetNameNoFormatting]"
 BILATERAL_NAVAL_LIMITATION_TREATY_POSSIBLE: "Target [concept_country] must possess a [concept_fleet]."
 BILATERAL_NAVAL_LIMITATION_TREATY_AT_WAR: "Countries must not be at [concept_war]."
 BILATERAL_NAVAL_LIMITATION_TREATY_INPUT_VALID: "Bilateral tonnage cap ratio must remain within valid bounds."
 BILATERAL_NAVAL_LIMITATION_TREATY_DUPLICATE_ARTICLE_SAME: "An identical bilateral limitation [concept_article] is already active."
 BILATERAL_NAVAL_LIMITATION_TREATY_ALREADY_RESTRICTED: "The target [concept_country] is already restricted by another active Bilateral Naval Limitation Treaty."

 global_naval_limitation_treaty: "Global Naval Limitation Treaty"
 global_naval_limitation_treaty_desc: "#lore \"Better to draw the tonnage boundaries of the oceans across a conference table than bankrupt the treasury in an endless naval race.\"#!\nA multilateral naval disarmament framework uniting major sea powers under transparent tonnage quotas and collective diplomatic oversight."
 global_naval_limitation_treaty_effects_desc: "•Locks signatory [concept_fleet] tonnage caps in a #v 5:5:3:1.75:1.75#! tier ratio\n•Compliant members gain #g -10%#! naval upkeep and [concept_prestige], with access to Quota Revisions, Isolation Sanctions, and the Escalator Clause"
 global_naval_limitation_treaty_article_short_desc: "[FIRST_COUNTRY.GetFlagTextIcon][FIRST_COUNTRY.GetNameNoFormatting] and [SECOND_COUNTRY.GetFlagTextIcon][SECOND_COUNTRY.GetNameNoFormatting] adhere to the Global Naval Limitation [concept_treaty]"
 GLOBAL_NAVAL_LIMITATION_TREATY_POSSIBLE: "Both countries must be at least a [concept_major_power]."
 GLOBAL_NAVAL_LIMITATION_TREATY_AT_WAR: "Countries must not be at [concept_war]."
 GLOBAL_NAVAL_LIMITATION_TREATY_COLLAPSED: "A new Global Naval Limitation Treaty cannot be formed during the 3-year post-collapse cooldown."
 GLOBAL_NAVAL_LIMITATION_TREATY_FORMED: "Once formed, new signatories must sign this [concept_article] with an active signatory power."
 GLOBAL_NAVAL_LIMITATION_TREATY_ALREADY_BOTH_MEMBERS: "Both countries cannot already be members of the Global Naval Limitation Treaty."

 nte_global.1.t: "Joined the Global Naval Limitation Treaty"
 nte_global.1.d: "Our delegates have signed the treaty. Fleet tonnage will be evaluated by ship era and complexity, and our tier ratio has been locked."
 nte_global.1.f: "Salutes replace broadsides — at least on paper, the powers pause their race for the seas."
 nte_global.1.a: "For maritime order and peace"
 nte_global.1.a.tt: "Opens the Global Naval Limitation Conference journal entry."

 nte_global.2.t: "Quota Revision Conference Vote"
 nte_global.2.d: "A new revision conference has convened. Votes are weighted by seat and effective tonnage, producing a continuous proportional adjustment."
 nte_global.2.f: "Diplomats and admirals haggle over every percentage point."
 nte_global.2.a: "Deep Disarmament (-15%)"
 nte_global.2.b: "Moderate Reduction (-5%)"
 nte_global.2.c: "Maintain Status Quo (0%)"
 nte_global.2.e: "Moderate Expansion (+5%)"
 nte_global.2.g: "Major Expansion (+15%)"

 nte_global.3.t: "Diplomatic Isolation Sanction Vote"
 nte_global.3.d: "A motion has been tabled to isolate [SCOPE.sCountry('nte_iso_target').GetName]. Passing with 75%+ weight strips benefits, cuts their cap by 25%, and imposes trade sanctions."
 nte_global.3.f: "When one power defies the rules, isolation becomes diplomacy's coldest hammer."
 nte_global.3.a: "Vote YES to isolate"
 nte_global.3.b: "Vote NO"

 nte_global.4.t: "Revision Conference Results"
 nte_global.4.d: "Ballots have been tallied. The base limit adjusted by #v [GetGlobalVariable('gnl_last_vote_pct_change').GetValue|1]%#! to #v [GetGlobalVariable('gnl_tonnage_base_limit').GetValue|0]#! tons."
 nte_global.4.f: "The machinery of naval diplomacy turns onward."
 nte_global.4.a: "Admiralty acknowledges new quotas"

 nte_bilateral.1.t: "[SCOPE.sCountry('nte_breaker').GetName] Breaks Naval Treaty"
 nte_bilateral.1.d: "[SCOPE.sCountry('nte_breaker').GetName] has unilaterally repudiated our bilateral naval limitation treaty."
 nte_bilateral.1.f: "Is a treaty iron law, or mere scrap paper?"
 nte_bilateral.1.a: "Deliver an Ultimatum!"
 nte_bilateral.1.b: "Lodge a formal protest only"

 nte_bilateral.2.t: "Ultimatum from [SCOPE.sCountry('nte_enforcer').GetName]"
 nte_bilateral.2.d: "[SCOPE.sCountry('nte_enforcer').GetName] demands we submit to naval limitations or face diplomatic and military consequences."
 nte_bilateral.2.f: "The telegram sits on the cabinet table."
 nte_bilateral.2.a: "Back down and accept naval slowdown"
 nte_bilateral.2.b: "Defy the ultimatum!"

 nte_bilateral.3.t: "[SCOPE.sCountry('nte_breaker').GetName] Defies Ultimatum!"
 nte_bilateral.3.d: "[SCOPE.sCountry('nte_breaker').GetName] rejected the ultimatum from [ROOT.GetCountry.GetName]. The cabinet awaits your final decision: sweeping sanctions or armed intervention."
 nte_bilateral.3.f: "Words are exhausted; only blockades or gunboats remain."
 nte_bilateral.3.a: "Impose 5-year Trade & Diplomatic Sanctions"
 nte_bilateral.3.b: "Launch Punitive Diplomatic Play!"
 nte_bilateral.3.c: "Stand down"

 nte_bilateral.10.t: "Naval Appeasement with Friendly Power"
 nte_bilateral.10.d: "Friendly [SCOPE.sCountry('nte_breaker').GetName] seeks release from our bilateral naval treaty. The cabinet suggests graceful appeasement to preserve our alliance."
 nte_bilateral.10.f: "Concessions to friends are called statesmanship—or weakness."
 nte_bilateral.10.a: "Accept reality & preserve friendship (Appeasement)"
 nte_bilateral.10.b: "Express stern disappointment"

