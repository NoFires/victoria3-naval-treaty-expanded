 nte_btn_toggle_mothball_fleet_name: "Mothball / Unmothball Reserve Fleet"
 nte_btn_toggle_mothball_fleet_desc: "Place reserve ships in port during peacetime to reduce effective treaty tonnage footprint by #v 18%#! and upkeep by #v 20%#!, at the cost of -25% [concept_naval_power_projection] and -35% capital ship construction efficiency."
 nte_btn_naval_intelligence_exchange_name: "Naval Intelligence & Dockyard Transparency"
 nte_btn_naval_intelligence_exchange_desc: "Spend minor administrative overhead to publish dockyard ledgers for diplomatic reputation, treaty stability, and tighter breach detection, refreshing all members' tonnage and ladder standings."
