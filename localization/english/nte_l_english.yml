 nte_global.5.t: "The Naval Holiday Initiative"
 nte_global.5.d: "The conference has tabled a Three-Year Naval Holiday, urging all Great Powers to freeze capital ship keels and redirect treasury funds toward domestic prosperity."
 nte_global.5.f: "Shipyard cranes fall silent; for a few winters at least, finance ministers may sleep soundly."
 nte_global.5.a: "Join the Naval Holiday"
 nte_global.5.b: "Decline and keep building"
 nte_btn_falsify_tonnage_name: "Falsify Admiralty Tonnage (Secret Cheat)"
 nte_btn_falsify_tonnage_desc: "Commit #v 50#! [concept_influence] to quietly under-report displacement figures for 24 months, hiding #v 12%#! of your effective fleet tonnage. Warning: monthly exposure risk rises sharply if rivals exchange intelligence or you operate super-heavy capital ships!"
 nte_ig_navy_disappointed: "Resents Naval Limitation Concessions"
 nte_ig_peace_dividend_happy: "Supports Naval Peace Dividend"
 nte_ig_navy_expansion_happy: "Supports Naval Expansion & Budget"
 nte_global.6.t: "Tonnage Falsification Exposed!"
 nte_global.6.d: "Foreign naval attachés obtained our true dockyard blueprints, exposing our systematic under-reporting of fleet tonnage to the world."
 nte_global.6.f: "Paper ledgers could not forever conceal steel Leviathans."
 nte_global.6.a: "A diplomatic catastrophe..."
 nte_je_activation_tt: "Activated by signing the Global Naval Limitation Treaty."
 nte_outcome_peace_effect_header: "Maritime Balance Preserved"
 nte_outcome_collapse_effect_header: "Treaty Order At Risk"
