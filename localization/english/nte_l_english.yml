 global_naval_limitation_union_reason: "#lore \"The seas belong to all mankind, not to the shadow of any single fleet. If the unbridled race of steel and heavy guns continues, only bankruptcy and a watery grave await the Great Powers.\"#!\n\nThis journal serves as the permanent diplomatic hub of the Global Naval Limitation Treaty, tracking real effective tonnage by #v ship era and complexity (hit point premium)#! (Capital Ships #v 100%#!, Cruisers #v 35%#!)."
 global_naval_limitation_union_desc: "#title Treaty Chair & Base Tonnage#!\nChair: [GetGlobalVariable('global_gnl_chair_country').GetCountry.GetName]  |  Current Base Limit: #v [GetGlobalVariable('gnl_tonnage_base_limit').GetValue|0]#! tons\n\n#title National Naval Readiness Dashboard#!\nLocked Tier: Rank #v [JournalEntry.GetCountry.MakeScope.Var('nte_locked_tier_rank').GetValue|0]#! (Ratio #v [JournalEntry.GetCountry.MakeScope.Var('nte_locked_tier_ratio').GetValue|2]#!)\nEffective Tonnage: #v [JournalEntry.GetCountry.MakeScope.Var('nte_current_tonnage').GetValue|0]#! / Legal Cap #v [JournalEntry.GetCountry.MakeScope.Var('nte_current_legal_limit').GetValue|0]#! tons (Usage #v [JournalEntry.GetCountry.MakeScope.Var('nte_quota_usage_pct').GetValue|0]%#!)\nRemaining Quota: #v [JournalEntry.GetCountry.MakeScope.Var('nte_tonnage_remaining').GetValue|0]#! tons (Negative values indicate breach; exceeding the 4-month grace period triggers infamy decay, trade, and shipbuilding sanctions.)\n\n#title Global Sea Power Ladder (Locked Tiers)#!\n[JournalEntry.GetCountry.GetCustom('nte_rank1_line')]\n[JournalEntry.GetCountry.GetCustom('nte_rank2_line')]\n[JournalEntry.GetCountry.GetCustom('nte_rank3_line')]\n[JournalEntry.GetCountry.GetCustom('nte_rank4_line')]\n[JournalEntry.GetCountry.GetCustom('nte_rank5_line')]"

